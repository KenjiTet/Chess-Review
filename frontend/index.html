<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Self-contained favicon: dark horse on a gold rounded tile. Carries its own
         background so it stays legible on any tab-bar colour (light or dark) without
         theme detection. Multiple sizes let high-DPI screens pick a sharp source. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png?v=11" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=11" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=11" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: theme + iOS home-screen install support (Android reads the manifest). -->
    <meta name="theme-color" content="#863bff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BlunderDrill" />
    <!-- Stop Chrome/Google from offering to translate the page (it triggers when the
         browser UI language differs from the page's lang="en"). -->
    <meta name="google" content="notranslate" />

    <!-- ── SEO ──────────────────────────────────────────────────────────────
         Single indexable URL (state-based SPA), so static head tags on / are
         sufficient and the most reliable option. Keep copy in sync with the
         PWA manifest description in vite.config.ts. -->
    <title>Chess Blunder Trainer - Drill Your Mistakes | BlunderDrill</title>
    <meta
      name="description"
      content="Turn your real Chess.com and Lichess games into puzzles. Stockfish finds every blunder you made ! Drill them until they stop happening. Free, no install."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://blunderdrill.com/" />

    <!-- Open Graph (Facebook, Discord, Slack, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlunderDrill" />
    <meta property="og:url" content="https://blunderdrill.com/" />
    <meta property="og:title" content="Chess Blunder Trainer — Drill Your Own Mistakes" />
    <meta
      property="og:description"
      content="Turn your real Chess.com and Lichess games into puzzles. Stockfish finds your blunders — you drill them until they stop happening."
    />
    <meta property="og:image" content="https://blunderdrill.com/og-image.png" />
    <meta property="og:image:alt" content="BlunderDrill — chess blunder trainer" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chess Blunder Trainer — Drill Your Own Mistakes" />
    <meta
      name="twitter:description"
      content="Turn your real Chess.com and Lichess games into puzzles. Stockfish finds your blunders — you drill them until they stop happening."
    />
    <meta name="twitter:image" content="https://blunderdrill.com/og-image.png" />
    <meta name="twitter:image:alt" content="BlunderDrill — chess blunder trainer" />

    <!-- Structured data: rich result eligibility for a free web application. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BlunderDrill",
        "url": "https://blunderdrill.com/",
        "description": "Train chess by drilling your own blunders. BlunderDrill analyses your Chess.com and Lichess games with Stockfish and turns your mistakes into interactive training positions.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Structured data: FAQ rich-result eligibility. Text must match the on-page
         FAQ copy in Landing.tsx word-for-word (structured-data compliance). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is BlunderDrill free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can look up any public Chess.com or Lichess player and start drilling their blunders for free. Create an account only if you want to save your progress."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to install anything?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. BlunderDrill runs entirely in your browser and can be installed as an app on your phone home screen if you want, but nothing is required."
            }
          },
          {
            "@type": "Question",
            "name": "Which chess sites are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Chess.com and Lichess. BlunderDrill reads your games directly from their public APIs, so any rated or casual game you have played is available."
            }
          },
          {
            "@type": "Question",
            "name": "How are blunders detected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Stockfish engine evaluates each position before and after your move. When your move loses significant evaluation compared to the best available move, it is classified as a mistake or blunder."
            }
          }
        ]
      }
    </script>

    <!-- Structured data: brand entity for BlunderDrill. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BlunderDrill",
        "url": "https://blunderdrill.com/",
        "logo": "https://blunderdrill.com/pwa-512x512.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

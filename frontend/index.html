<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme-aware tab favicon (modern browsers): black mark on light UI,
         gold mark on dark UI. -->
    <link rel="icon" type="image/svg+xml" href="/blunderdrill_favicon_black.svg?v=5" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/blunderdrill_favicon_gold.svg?v=5" media="(prefers-color-scheme: dark)" />
    <!-- Raster fallback (favorites bar, Google, browsers without SVG/media support):
         the black favicon design, NOT the app icon. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: theme + iOS home-screen install support (Android reads the manifest). -->
    <meta name="theme-color" content="#863bff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BlunderDrill" />
    <!-- Stop Chrome/Google from offering to translate the page (it triggers when the
         browser UI language differs from the page's lang="en"). -->
    <meta name="google" content="notranslate" />
    <title>BlunderDrill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
